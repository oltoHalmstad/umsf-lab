; umsf-ble-firmware - PlatformIO project
;
; NOTE (release 1.0.0): the three ESP32 environments below were NOT compiled or flashed for this
; release (PlatformIO registry access was unavailable in the build environment). The portable
; libraries in lib/ are compiled and unit-tested on the host (test/host/Makefile, g++/gcc).
; Library versions are pinned to releases known to the authors; verify them before first build.
;
;   pio run -e personnel_node -t upload
;   pio run -e stationary_node -t upload
;   pio run -e gateway -t uploadfs   (certificates in data/: ca.pem, client.crt, client.key)
;   pio run -e gateway -t upload
;   pio test -e native

[platformio]
default_envs = personnel_node, stationary_node, gateway

[esp32_common]
; espressif32 6.9.0 = Arduino-ESP32 2.0.17 (ESP-IDF 4.4, mbedTLS 2.28 -> TLS 1.2 only, see docs/SECURITY.md).
; NimBLE-Arduino 1.4.x targets this core (2.x of NimBLE-Arduino changed the callback API).
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DUMSF_FW_BUILD=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

[env:personnel_node]
extends = esp32_common
build_src_filter = +<personnel_node/> +<common/> +<node_common/>
build_flags =
    ${esp32_common.build_flags}
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DUMSF_DEVICE_ID=\"A01\"
    -DUMSF_PASSKEY=123456
    -DUMSF_HAS_GSR=0
lib_deps =
    ${esp32_common.lib_deps}
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0

[env:stationary_node]
extends = esp32_common
build_src_filter = +<stationary_node/> +<common/> +<node_common/>
build_flags =
    ${esp32_common.build_flags}
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DUMSF_DEVICE_ID=\"S01\"
    -DUMSF_NODE_INDEX=1
    -DUMSF_PASSKEY=654321
lib_deps =
    ${esp32_common.lib_deps}
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit Unified Sensor@1.1.14
    adafruit/Adafruit BusIO@1.16.1

[env:gateway]
extends = esp32_common
; BLE central + Wi-Fi AP/STA + TLS client: use the larger app partition
board_build.partitions = min_spiffs.csv
build_src_filter = +<gateway/> +<common/>
build_flags =
    ${esp32_common.build_flags}
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DUMSF_GATEWAY_ID=\"AG1\"
    -DUMSF_SITE_ID=\"A\"
lib_deps =
    ${esp32_common.lib_deps}
    bertmelis/espMqttClient@1.7.0

[env:native]
; host unit tests of lib/ (same cases as test/host/Makefile, run under Unity)
platform = native
test_build_src = no
build_flags =
    -std=gnu++17
    -DUMSF_USE_UNITY
    -DUNITY_SUPPORT_64
    -DUNITY_INCLUDE_DOUBLE
test_framework = unity
lib_compat_mode = off
